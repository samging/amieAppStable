site_name: Amie desktop app
site_description: How to use the Amie desktop app - sign-in, the sandbox, scripting, models and metrics
docs_dir: docs
site_dir: build/docs-site
use_directory_urls: true

theme:
  name: material
  palette:
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Start here:
      - Overview: index.md
      - Getting started: getting-started.md
  - Working in the app:
      - The sandbox: sandbox.md
      - Running sessions: sessions.md
      - Scripting API: sandbox-scripting.md
      - Cookbook, scripts to copy: cookbook.md
      - Models and metrics: models.md
      - Serving a model: serving.md
      - Devices: devices.md
  - Reference:
      - The AMP folder: amp-folder.md
      - Signing in: sign-in.md
      - Keycloak setup: authentication.md
      - Amie backend: backend-integration.md
      - Models page: models-page.md
      - Settings: settings.md
      - Troubleshooting: troubleshooting.md
